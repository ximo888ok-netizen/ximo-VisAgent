    <!-- 与 island.html 同源的收紧版 CSP（splash 不联网、不加载外部资源） -->
    <meta

    <title>ximo-VisAgent</title>
    <style>
      /* 变量值逐一取自 island.css 的双主题定义（静态页不引框架：启动动画的意义就是首帧即显） */
      :root {
        --shell-rgb: 26, 26, 26;
        --shell-opacity: 0.68;
        --border: rgba(255, 255, 255, 0.18);
        --glass-rim-hot: rgba(255, 255, 255, 0.42);
        --glass-shade-hot: rgba(0, 0, 0, 0.34);
        --glass-lens-top: rgba(255, 255, 255, 0.15);
        --glass-lens-bottom: rgba(0, 0, 0, 0.42);
        --glass-lens-ambient: rgba(255, 255, 255, 0.13);
        --glass-hi-fade: rgba(255, 255, 255, 0);
        --glass-shade-fade: rgba(0, 0, 0, 0);
        --glass-specular: rgba(255, 255, 255, 0.1);
        --glass-hotspot: rgba(255, 255, 255, 0.14);
        --glass-band: 10px; /* splash 高度恒为 64，用定值即可，不必像岛那样 clamp */
        --t-strong: #f2f4f8;
        --t-muted: rgba(238, 241, 246, 0.64);
        --t-faint: rgba(238, 241, 246, 0.46);
        --track: rgba(255, 255, 255, 0.07); /* = island 的 --ig-line */
        --accent: #3fe0a0; /* --c-thinking */
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
      }
      html.light {
        --shell-rgb: 255, 255, 255;
        --border: rgba(24, 28, 40, 0.16);
        --glass-rim-hot: rgba(255, 255, 255, 1);
        --glass-shade-hot: rgba(15, 23, 42, 0.12);
        --glass-lens-top: rgba(15, 23, 42, 0.045);
        --glass-lens-bottom: rgba(15, 23, 42, 0.11);
        --glass-lens-ambient: rgba(15, 23, 42, 0.06);
        --glass-hi-fade: rgba(255, 255, 255, 0);
        --glass-shade-fade: rgba(15, 23, 42, 0);
        --glass-specular: rgba(255, 255, 255, 0.5);
        --glass-hotspot: rgba(255, 255, 255, 0.7);
        --t-strong: #171a21;
        --t-muted: rgba(26, 29, 36, 0.64);
        --t-faint: rgba(26, 29, 36, 0.54);
        --track: rgba(15, 23, 42, 0.08); /* = island 的 --ig-line */
        --accent: #0e9f6e; /* 浅色主题的 thinking 绿 */
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
          "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 岛的收起态外壳：64px 高、圆角 22（IslandShell 同款） */
      .bar {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 64px;
        /* 与 island 的 .island-shell-bg 同款六层玻璃（1/3/5 层 + 4 层边缘），
           保证启动动画交接时材质不跳变 */
        background:
          radial-gradient(150px 48px at 16% 0%, var(--glass-hotspot), var(--glass-hi-fade) 100%),
          linear-gradient(148deg, var(--glass-specular) 0%, var(--glass-hi-fade) 42%),
          linear-gradient(
            180deg,
            var(--glass-lens-top) 0,
            var(--glass-hi-fade) var(--glass-band),
            var(--glass-shade-fade) calc(100% - var(--glass-band)),
            var(--glass-lens-bottom) 100%
          ),
          rgba(var(--shell-rgb), var(--shell-opacity));
        border: 1px solid var(--border);
        box-shadow:
          inset 0 1px 0 0 var(--glass-rim-hot),
          inset 0 -1px 0 0 var(--glass-shade-hot),
          inset 0 0 30px -14px var(--glass-lens-ambient);
        border-radius: 22px;
        display: flex;
        align-items: stretch;
        overflow: hidden;
        opacity: 0;
        transform: translateY(-6px);
        animation: bar-in 420ms var(--ease) forwards;
      }
      @keyframes bar-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .bar.out {
        animation: bar-out 300ms var(--ease) forwards;
      }
      /* from 必须显式写出：只覆盖 animation 简写时，隐式起点会取回 .bar 声明的
         opacity: 0（动画填充被替换后不再生效），结果动画变成 0 → 0，看不出淡出。 */
      @keyframes bar-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* 左缘拖拽点：与 IslandShell 的手柄 SVG 一比一复刻（可发现性：这看起来就是岛） */
      .grip {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        flex-shrink: 0;
        opacity: 0.4;
      }

      /* 状态区：宽度与 IslandStatus 的 156px 硬绑死。
         交接时三层（grip / status / actions）宽度必须逐像素一致，
         否则两条分隔线会在交接瞬间水平跳动——而那一刻用户正盯着看。 */
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 0 0 12px;
        width: 156px;
        flex-shrink: 0;
      }

      /* 指示灯：与岛「idle」态同款同心双环（20 网格 / 描边 1.5）。
         岛启动完进入的就是 idle，所以这里必须画 idle 而不是别的状态，
         否则交接瞬间指示灯会变色变尺寸。呼吸节奏也统一为 2.6s。 */
      .ring {
        flex-shrink: 0;
        transform-origin: 50% 50%;
        animation: breathe 2.6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .status-label {
        color: var(--t-strong);
        font-size: 12px;
        font-weight: 500;
      }

      .divider {
        width: 1px;
        margin: 16px 0;
        background: var(--track);
        flex-shrink: 0;
      }

      /* 中庭：阶段文本。内边距与 IslandLog 保持一致（岛那边是 0，文字紧贴分隔线），
         所以这里也不再额外 padding，否则交接时阶段文字会横向位移。 */
      .stage-area {
        flex: 1;
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .stage {
        color: var(--t-muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 180ms ease;
        min-height: 14px;
      }

      /* 右区：宽度与 IslandActions 的 120px 对齐，内容靠右、
         右侧留 12px —— 岛那边最右边的按钮距壳体右缘正好是 pr-3（12px）。 */
      .brand {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        width: 120px;
        padding: 0 12px 0 0;
        flex-shrink: 0;
        color: var(--t-faint);
        font-size: 11px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* 底缘进度线：真实启动节点驱动宽度（不是匀速假进度）。取值落到 8pt 阶梯上。 */
      .progress {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 8px;
        height: 2px;
        border-radius: 1px;
        background: var(--track);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 10%;
        background: var(--accent);
        border-radius: 1px;
        transition: width 500ms var(--ease);
      }

      @media (prefers-reduced-motion: reduce) {
        .bar,
        .bar.out {
          animation-duration: 1ms;
        }
        .ring {
          animation: none;
          opacity: 0.8;
        }
        .fill {
          transition: none;
        }
      }
    </style>

    <script>
      // 主题：主进程经 URL 参数传入（静态页无 preload，不为一次性窗口扩 IPC 契约）
      var theme = new URLSearchParams(location.search).get("theme");
      document.documentElement.classList.toggle("light", theme === "light");

      // 由主进程经 executeJavaScript 驱动（见 splash.ts 头注释）
      window.__splashStage = function (text, ratio) {
        var stage = document.getElementById("stage");
        stage.style.opacity = "0";
        setTimeout(function () {
          stage.textContent = text;
          stage.style.opacity = "1";
        }, 180);
        var pct = Math.round(Math.max(0, Math.min(1, ratio)) * 100);
        document.getElementById("fill").style.width = pct + "%";
      };
      window.__splashOut = function () {
        document.getElementById("bar").classList.add("out");
      };
    </script>
