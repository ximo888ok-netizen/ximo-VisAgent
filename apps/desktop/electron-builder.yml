productName: ximo-VisAgent
appId: io.ximo.visagent
copyright: Copyright © 2026 ximo-VisAgent
directories:
  buildResources: build
  output: release
# 只保留中英文 locale（全量 55 种语言 ~48MB，UI 与系统托盘均无其他语言入口）
electronLanguages:
  - zh-CN
  - en-US
# afterPack：清 better-sqlite3 编译中间产物 / koffi 非 win32 二进制（见 scripts/trim-after-pack.cjs）
afterPack: ./scripts/trim-after-pack.cjs
files:
  - resources/**/*
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/.git/*"
extraResources:
  - from: ../../native/uia-sidecar-cs/bin/uia-sidecar.exe
    to: uia-sidecar.exe
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**
  - node_modules/koffi/**
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ximo-VisAgent
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/